---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/guitton.com.br
    - /bin/mkdir -p "$DEPLOYPATH/data" "$DEPLOYPATH/assets/uploads"
    - /bin/cp index.html pos-locacao.html consultoria.html parceiros.html blog.html blog.php post.php newsletter.php unsubscribe.php privacidade.php sitemap.php 404.php robots.txt styles.css script.js .htaccess "$DEPLOYPATH/"
    - /bin/cp -R app admin partials "$DEPLOYPATH/"
    - /bin/cp -R assets/. "$DEPLOYPATH/assets/"
    - /usr/bin/test -f "$DEPLOYPATH/data/posts.json" || /bin/cp data/posts.json "$DEPLOYPATH/data/posts.json"
    - /bin/cp data/.htaccess "$DEPLOYPATH/data/.htaccess"
    - /bin/chmod 755 "$DEPLOYPATH" "$DEPLOYPATH/data" "$DEPLOYPATH/assets" "$DEPLOYPATH/assets/uploads" "$DEPLOYPATH/admin" "$DEPLOYPATH/app" "$DEPLOYPATH/partials"
    - /bin/chmod 644 "$DEPLOYPATH/data/posts.json" "$DEPLOYPATH/data/.htaccess"
